# Pull every Victorian meeting card from Form King into the history database.
# Morning run: cards, odds, every runner's last 12 runs; scores and prices are
# published for the website (public.edge_* tables).
# Night run: the same cards again, so today's results land in the runs table
# and on the website's Meeting Review. Every default run (and a 1:47am
# catch-up) also re-pulls any meeting from the last 3 days still missing
# results, so a skipped night run never loses a meeting's review.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   FORMKING_API_KEY   your Form King key
#   FORMKING_BASE_URL  https://api.formking.com.au
#   DATABASE_URL       Supabase connection string (VIC FORM project, session pooler)
name: Harvest Form King

on:
  schedule:
    - cron: "17 22 * * *"   # 9:17am AEDT / 8:17am AEST
    - cron: "7 1 * * *"     # 12:07pm AEDT: prices and scratchings before most first races
    - cron: "37 12 * * *"   # 11:37pm AEDT / 10:37pm AEST
    - cron: "47 14 * * *"   # 1:47am AEDT: results catch-up only (GitHub sometimes skips a scheduled run)
  workflow_dispatch:         # "Run workflow" button, or the website's Sync button
    inputs:
      date:
        description: "Melbourne date YYYY-MM-DD (blank = today)"
        required: false
        default: ""

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Harvest today's meetings
        env:
          FORMKING_API_KEY: ${{ secrets.FORMKING_API_KEY }}
          FORMKING_BASE_URL: ${{ secrets.FORMKING_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HARVEST_MAX_MEETINGS: "8"
          HARVEST_DATE: ${{ inputs.date }}
        run: |
          if [ "${{ github.event.schedule }}" = "47 14 * * *" ]; then python harvest.py --catchup-only
          elif [ -n "$HARVEST_DATE" ]; then python harvest.py --date "$HARVEST_DATE"
          else python harvest.py; fi
