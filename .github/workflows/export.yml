# Export the history for offline model work. The files are encrypted with
# tools/export_pub.pem before upload (this repo's artifacts are public), so only
# the holder of the matching private key can read them.
name: Export history (encrypted)
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python tools/export_history.py
          tar czf export.tgz export_*.csv && rm export_*.csv
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in export.tgz -out export.tgz.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey tools/export_pub.pem -in k.txt -out k.enc
          rm export.tgz k.txt
      - uses: actions/upload-artifact@v4
        with:
          name: history-export
          path: |
            export.tgz.enc
            k.enc
          retention-days: 1
