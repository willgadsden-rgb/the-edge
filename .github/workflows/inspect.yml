# Diagnostic: print the structure of a stored Form King card (no API credits).
name: Inspect stored card
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "meeting id (or part of it)"
        required: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python tools/inspect_raw.py "${{ inputs.ref }}"
