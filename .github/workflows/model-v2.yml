# Refit model v2 on the full history (results-fitted pricing). No Form King credits.
# The next harvest picks the new weights up automatically.
name: Fit model v2
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fit (default) or audit (stress-test only, saves nothing)"
        required: false
        default: "fit"
  schedule:
    - cron: "23 17 * * 0"    # Monday 4:23am AEDT
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python model_v2.py --${{ inputs.mode || 'fit' }}
