# Re-pull meetings we already hold and publish them to the website, so Meeting
# Review can show past days. 5 Form King credits per meeting.
# Safe to re-run: meetings already on the site with results are skipped.
name: Publish past meetings
on:
  workflow_dispatch:
    inputs:
      from:
        description: "From date YYYY-MM-DD"
        required: true
      to:
        description: "To date YYYY-MM-DD"
        required: true
      max:
        description: "Most meetings this run"
        required: false
        default: "100"
concurrency:
  group: backfill
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          FORMKING_API_KEY: ${{ secrets.FORMKING_API_KEY }}
          FORMKING_BASE_URL: ${{ secrets.FORMKING_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python harvest.py --publish-window "${{ inputs.from }}" "${{ inputs.to }}" --max "${{ inputs.max }}"
